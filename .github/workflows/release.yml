name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
            arch_suffix: ARM64
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      # ------------------------------------------------------------------
      # Windows
      # ------------------------------------------------------------------
      - name: "[Windows] Build EXE"
        if: matrix.platform == 'windows'
        run: pyinstaller --noconfirm --onefile --windowed --name Parrot --icon static/logos/parrot_yellow.ico launcher.py

      - name: "[Windows] Instalar Inno Setup"
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress -y

      - name: "[Windows] Compilar instalador con Inno Setup"
        if: matrix.platform == 'windows'
        run: iscc parrot_installer.iss

      - name: "[Windows] Preparar artefacto final"
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p out_release
          cp dist_installer/Parrot_Setup_Windows.exe out_release/

      # ------------------------------------------------------------------
      # macOS
      # ------------------------------------------------------------------
      - name: "[macOS] Build APP"
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --noconfirm --windowed --name Parrot --icon static/logos/parrot_yellow.icns launcher.py

          mkdir -p dist/Parrot.app/Contents/Resources/src
          cp main.py dist/Parrot.app/Contents/Resources/src/
          cp tray_icon.py dist/Parrot.app/Contents/Resources/src/
          cp hosts_setup.py dist/Parrot.app/Contents/Resources/src/
          cp requirements.txt dist/Parrot.app/Contents/Resources/src/
          cp README.md dist/Parrot.app/Contents/Resources/src/
          cp TERMS.md dist/Parrot.app/Contents/Resources/src/
          cp -R frontend dist/Parrot.app/Contents/Resources/src/
          cp -R services dist/Parrot.app/Contents/Resources/src/
          cp -R static dist/Parrot.app/Contents/Resources/src/

          # Copiar archivos al bundle DESPUÉS de que PyInstaller lo firmó invalida la firma
          # ad-hoc (macOS detecta que el contenido no coincide con lo firmado y muestra
          # "la app está dañada" en vez del más benigno "desarrollador no identificado").
          # Hay que volver a firmar después de terminar de modificar el bundle.
          codesign --deep --force --sign - dist/Parrot.app

      - name: "[macOS] Compilar ffmpeg propio (LGPL, sin GPL/nonfree)"
        if: matrix.platform == 'macos'
        run: |
          brew install nasm lame pkg-config

          FFMPEG_VERSION=8.1.2
          LAME_PREFIX="$(brew --prefix lame)"
          curl -L -o ffmpeg-src.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar xf ffmpeg-src.tar.xz
          cd "ffmpeg-${FFMPEG_VERSION}"

          ./configure \
            --disable-gpl \
            --disable-nonfree \
            --disable-doc \
            --disable-debug \
            --disable-ffplay \
            --enable-libmp3lame \
            --extra-cflags="-I${LAME_PREFIX}/include" \
            --extra-ldflags="-L${LAME_PREFIX}/lib"

          make -j"$(sysctl -n hw.ncpu)"
          cd ..

          mkdir -p out_release
          zip -j out_release/Parrot_ffmpeg_macos_arm64_lgpl.zip \
            "ffmpeg-${FFMPEG_VERSION}/ffmpeg" \
            "ffmpeg-${FFMPEG_VERSION}/ffprobe"

      - name: "[macOS] Instalar create-dmg"
        if: matrix.platform == 'macos'
        run: |
          brew untap aws/tap || true
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install create-dmg

      - name: "[macOS] Empaquetar DMG"
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dmg_root out_release
          cp -R dist/Parrot.app dmg_root/
          create-dmg \
            --volname "Parrot" \
            --window-size 500 300 \
            --icon-size 100 \
            --app-drop-link 375 150 \
            "out_release/Parrot_macOS_${{ matrix.arch_suffix }}.dmg" \
            "dmg_root/"

      # ------------------------------------------------------------------
      # Linux
      # ------------------------------------------------------------------
      - name: "[Linux] Build Binary"
        if: matrix.platform == 'linux'
        run: |
          pyinstaller --noconfirm --onedir --console --name Parrot launcher.py
          
          mkdir -p AppDir/usr/bin AppDir/usr/src out_release
          cp -R dist/Parrot/* AppDir/usr/bin/
          cp main.py AppDir/usr/src/
          cp tray_icon.py AppDir/usr/src/
          cp hosts_setup.py AppDir/usr/src/
          cp requirements.txt AppDir/usr/src/
          cp README.md AppDir/usr/src/
          cp TERMS.md AppDir/usr/src/
          cp -R frontend AppDir/usr/src/
          cp -R services AppDir/usr/src/
          cp -R static AppDir/usr/src/

          echo "[Desktop Entry]" > AppDir/parrot.desktop
          echo "Name=Parrot" >> AppDir/parrot.desktop
          echo "Exec=Parrot" >> AppDir/parrot.desktop
          echo "Icon=parrot" >> AppDir/parrot.desktop
          echo "Type=Application" >> AppDir/parrot.desktop
          echo "Categories=AudioVideo;" >> AppDir/parrot.desktop

          cp static/logos/parrot_logo.png AppDir/parrot.png

          echo '#!/bin/sh' > AppDir/AppRun
          echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> AppDir/AppRun
          echo 'export PATH="${HERE}/usr/bin:${PATH}"' >> AppDir/AppRun
          echo 'export APPDIR="${HERE}"' >> AppDir/AppRun
          echo 'exec "${HERE}/usr/bin/Parrot" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: "[Linux] Descargar appimagetool y empaquetar"
        if: matrix.platform == 'linux'
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          wget -q -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool AppDir out_release/Parrot_Linux.AppImage

      # ------------------------------------------------------------------
      # Publicación
      # ------------------------------------------------------------------
      - name: Publicar assets en el Release
        uses: softprops/action-gh-release@v2
        with:
          files: out_release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
